root = "/app"
tmp_dir = "tmp/api"

[build]
    cmd = "go build -o ./tmp/api/server ./cmd/api"
    bin = "./tmp/api/server"

    include_ext = ["go", "sql", "yaml", "toml"]
    include_dir = ["cmd/api", "internal", "pkg"]
    exclude_dir = ["tmp", "node_modules", ".git", "migrations"]
    exclude_regex = []
    exclude_unchanged = true
    follow_symlink = false

    delay = 500

    stop_on_error = true

    send_interrupt = true
    kill_delay = "3s"

    poll = true
    poll_interval = 500

[log]
    time = true
    main_only = false

[color]
    main = "magenta"
    watcher = "cyan"
    build = "yellow"
    runner = "green"

[misc]
    clean_on_exit = true

[screen]
    clear_on_rebuild = false
    keep_scroll = true